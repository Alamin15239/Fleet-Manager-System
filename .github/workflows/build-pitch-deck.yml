name: Build pitch deck
on:
  workflow_dispatch:
  push:
    paths:
      - 'pitch-deck/build_pitch_deck.py'
      - '.github/workflows/build-pitch-deck.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-pptx
      - run: python pitch-deck/build_pitch_deck.py
      - name: Commit generated PowerPoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pitch-deck/Fleet_Manager_Pro_Startup_Pitch_Deck.pptx
          git diff --cached --quiet || git commit -m "Build polished Fleet Manager Pro pitch deck"
          git push
