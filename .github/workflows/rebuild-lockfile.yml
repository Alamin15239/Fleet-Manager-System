# One-click lockfile repair: regenerates package-lock.json on LINUX so it
# includes every platform's native packages (lightningcss, @swc/core,
# @next/swc variants). Run this after dependency changes; commit done here.
name: Rebuild lockfile (Linux)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild package-lock.json (real install on Linux)
        run: npm install --no-audit --no-fund

      - name: Commit the rebuilt lockfile
        run: |
          git config user.name "Alamin developer"
          git config user.email "alamin.kha.saadfreeh@gmail.com"
          git add package-lock.json
          git diff --cached --quiet || (git commit -m "chore: rebuild package-lock.json on Linux (adds all platform native variants)" && git push)
