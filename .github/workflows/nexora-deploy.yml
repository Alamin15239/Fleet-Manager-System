name: Nexora artifact staging (static preview)

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Nexora deployment ID
        required: true
        type: string
      commit_sha:
        description: Immutable commit SHA selected by Nexora
        required: true
        type: string
      output_directory:
        description: Relative static build output directory configured in Nexora
        required: true
        type: string
        default: dist

permissions:
  contents: read
  id-token: write

concurrency:
  group: nexora-deployment-${{ inputs.deployment_id }}
  cancel-in-progress: false

jobs:
  stage-static-artifact:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      EXPECTED_COMMIT: ${{ inputs.commit_sha }}
      OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
      NEXORA_API: https://api.nexoraedge.digital
      OIDC_AUDIENCE: https://api.nexoraedge.digital/github-deployments
    steps:
      - name: Check out the exact deployment commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]]
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_COMMIT" ]] || {
            echo "Checked-out commit does not match the Nexora deployment request." >&2
            exit 1
          }

      # Supports npm static projects (npm ci/install + npm run build) and plain
      # static repositories without a package.json. Build commands run on a
      # disposable GitHub-hosted runner, never on Nexora servers.
      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OUTPUT_DIRECTORY" =~ ^[A-Za-z0-9._/-]{1,160}$ ]]
          [[ "$OUTPUT_DIRECTORY" != /* ]]
          [[ "/$OUTPUT_DIRECTORY/" != *"/../"* ]]
          [[ "$OUTPUT_DIRECTORY" == "." ]] || [[ "/$OUTPUT_DIRECTORY/" != *"/./"* ]]
          if test -f package.json; then
            if test -f package-lock.json; then
              npm ci
            else
              npm install --no-audit --no-fund
            fi
            npm run build --if-present
          fi
          test -d "$OUTPUT_DIRECTORY"
          if find "$OUTPUT_DIRECTORY" -type l -print -quit | grep -q .; then
            echo "Symbolic links are not permitted in the static output." >&2
            exit 1
          fi
          if find "$OUTPUT_DIRECTORY" ! -type d ! -type f -print -quit | grep -q .; then
            echo "Special files are not permitted in the static output." >&2
            exit 1
          fi

      - name: Package and stage private artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/nexora-static.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            --exclude='./.git' \
            -C "$OUTPUT_DIRECTORY" -czf "$artifact" .
          bytes="$(stat -c '%s' "$artifact")"
          if (( bytes < 1 || bytes > 104857600 )); then
            echo "Artifact must be between 1 byte and 100 MiB." >&2
            exit 1
          fi
          digest="$(sha256sum "$artifact" | awk '{print $1}')"

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
          oidc_token="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" | jq -er '.value')"

          exchange="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $oidc_token" \
            "$NEXORA_API/v1/github/deployments/$DEPLOYMENT_ID/oidc/exchange")"
          upload_token="$(jq -er '.uploadToken' <<<"$exchange")"

          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $upload_token" \
            -H "Content-Type: application/gzip" \
            -H "X-Artifact-SHA256: $digest" \
            --data-binary "@$artifact" \
            "$NEXORA_API/v1/github/deployments/$DEPLOYMENT_ID/artifact"

          echo "Artifact staged privately in Nexora. This workflow does not publish or activate a release."
