name: Apply approved TiDB production schema repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-tidb-schema-repair.yml

permissions:
  contents: read

concurrency:
  group: tidb-production-schema-repair
  cancel-in-progress: false

jobs:
  apply-reviewed-repair:
    if: ${{ github.event.head_commit.message == 'Enable approved TiDB production schema repair workflow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate target and regenerate the exact reviewed repair
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TIDB_DATABASE_URL" || { echo "::error::Missing TIDB_DATABASE_URL"; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          u = urlsplit(os.environ["TIDB_DATABASE_URL"])
          if u.scheme not in ("postgres", "postgresql") or not u.hostname or not u.hostname.endswith(".tidbcloud.com"):
              raise SystemExit("Refusing non-TiDB PostgreSQL endpoint")
          if "sslmode=require" not in (u.query or ""):
              raise SystemExit("TiDB connection must require TLS")
          print(f"Validated TiDB endpoint: {u.hostname}; database={u.path.lstrip('/')}")
          PY
          mkdir -p migration-artifacts
          docker run --rm --network host -e TIDB_DATABASE_URL -v "$PWD/migration-artifacts:/work" -w /work postgres:18 bash -euo pipefail -c '
            pg_dump --schema-only --schema=public --no-owner --no-privileges "$TIDB_DATABASE_URL" > tidb-current-schema.sql
          '
          npx --yes prisma@6.15.0 migrate diff \
            --from-url "$TIDB_DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > migration-artifacts/tidb-to-prisma-schema-diff.sql
          python3 - <<'PY'
          import re
          p = "migration-artifacts/tidb-to-prisma-schema-diff.sql"
          sql = open(p, encoding="utf-8").read()
          sql = re.sub(r'(?m)^DROP TABLE "public"\."tidbcloud_com_cell_[^"]+";\s*\n?', "", sql)
          sql = re.sub(r'(?m)^DROP INDEX "public"\."maintenance_records_vehiclePlateNumber_idx";\s*\n?', "", sql)
          sql = re.sub(r'(?m)^DROP INDEX "public"\."tire_lifecycle_events_tireId_eventAt_idx";\s*\n?', "", sql)
          sql = re.sub(r'(?m)^CREATE INDEX "tire_lifecycle_events_tireId_eventAt_idx" ON "public"\."tire_lifecycle_events"\("tireId", "eventAt"\);\s*\n?', "", sql)
          old = 'DROP INDEX "public"."email_logs_emailId_key";'
          if old not in sql:
              raise SystemExit("Expected obsolete email_logs unique index drop missing")
          current = open("migration-artifacts/tidb-current-schema.sql", encoding="utf-8").read()
          if 'CREATE INDEX "email_logs_emailId_idx"' not in current:
              raise SystemExit("Existing email_logs lookup index not found; refusing repair")
          drops = re.findall(r'(?im)^\s*DROP\s+(?:TABLE|INDEX|TYPE|SCHEMA)\b.*;', sql)
          if any(x.strip() != old for x in drops):
              raise SystemExit("Unexpected destructive DDL: " + repr(drops))
          if 'DROP TABLE "public"."tidbcloud_com_cell_' in sql:
              raise SystemExit("Refusing to drop TiDB-managed tables")
          expected = "3a21752056eace1aecb217eca31104c066e9edf1211bb5efc79480671dbbd24d"
          import hashlib
          actual = hashlib.sha256(sql.encode()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Generated SQL differs from approved preflight artifact: {actual}")
          open("migration-artifacts/tidb-schema-repair-public.sql", "w", encoding="utf-8").write(sql)
          print("Exact approved SQL SHA-256 verified.")
          PY

      - name: Verify production baseline, apply repair, and prove row counts unchanged
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network host \
            -e TIDB_DATABASE_URL \
            -v "$PWD/migration-artifacts:/work" -w /work \
            postgres:18 bash -euo pipefail -s <<'CONTAINER_SCRIPT'
          app_tables=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' AND table_name NOT LIKE 'tidbcloud_com_cell_%'")
          if [ "$app_tables" != "24" ]; then
            echo "Refusing repair: expected exactly 24 imported application tables, found $app_tables."
            exit 1
          fi
          psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -F '|' -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' AND table_name NOT LIKE 'tidbcloud_com_cell_%' ORDER BY table_name" > before-tables.txt
          : > before-counts.txt
          while IFS= read -r table; do
            count=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM \"public\".\"$table\"")
            printf '%s|%s\n' "$table" "$count" >> before-counts.txt
          done < before-tables.txt
          total=$(awk -F '|' '{s += $2} END {print s+0}' before-counts.txt)
          if [ "$total" != "687" ]; then
            echo "Refusing repair: expected 687 migrated rows, found $total."
            exit 1
          fi
          echo "Baseline verified: 24 application tables, 687 rows."
          psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tidb-schema-repair-public.sql
          after_tables=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' AND table_name NOT LIKE 'tidbcloud_com_cell_%'")
          if [ "$after_tables" -lt "44" ]; then
            echo "Schema repair incomplete: only $after_tables application tables."
            exit 1
          fi
          while IFS='|' read -r table expected; do
            actual=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM \"public\".\"$table\"")
            if [ "$actual" != "$expected" ]; then
              echo "Existing data changed unexpectedly in $table: before=$expected after=$actual"
              exit 1
            fi
            printf 'PRESERVED %s %s rows\n' "$table" "$actual"
          done < before-counts.txt
          echo "SUCCESS: schema repair applied; all 687 existing rows preserved."
          CONTAINER_SCRIPT
