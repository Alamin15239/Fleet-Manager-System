name: Neon to TiDB PostgreSQL Migration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Export, safely test the schema/data in an isolated TiDB schema, or migrate into public"
        required: true
        type: choice
        options:
          - export
          - preflight
          - migrate
        default: export
      confirm_target_empty:
        description: "Required for migrate: confirm the TiDB target has no application tables/data"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: neon-to-tidb-migration
  cancel-in-progress: false

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NEON_DATABASE_URL" || { echo "::error::Missing NEON_DATABASE_URL repository secret"; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote
          value = os.environ["NEON_DATABASE_URL"]
          parsed = urlsplit(value)
          if parsed.scheme not in ("postgres", "postgresql") or not parsed.hostname:
              raise SystemExit("NEON_DATABASE_URL is not a valid PostgreSQL URL")
          database = unquote(parsed.path.lstrip("/"))
          print("Neon source endpoint (credentials hidden):")
          print(f"  host={parsed.hostname}")
          print(f"  port={parsed.port or 5432}")
          print(f"  database={database or '(not specified)'}")
          PY
          if [[ "${{ inputs.operation }}" == "preflight" || "${{ inputs.operation }}" == "migrate" ]]; then
            test -n "$TIDB_DATABASE_URL" || { echo "::error::Missing TIDB_DATABASE_URL repository secret"; exit 1; }
          fi
          if [[ "${{ inputs.operation }}" == "migrate" ]]; then
            [[ "${{ inputs.confirm_target_empty }}" == "true" ]] || { echo "::error::Set confirm_target_empty only after verifying the TiDB database is empty"; exit 1; }
          fi

      - name: Export schema and source row counts
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p migration-artifacts
          docker run --rm --network host \
            -e NEON_DATABASE_URL \
            -v "$PWD/migration-artifacts:/work" -w /work \
            postgres:18 bash -euo pipefail -c '
              pg_dump --version
              pg_dump --schema-only --schema=public --no-owner --no-privileges "$NEON_DATABASE_URL" > schema.sql
              psql "$NEON_DATABASE_URL" -X -v ON_ERROR_STOP=1 -v schema_name=public -At -F "|" -c "
                SELECT schemaname, tablename
                FROM pg_tables
                WHERE schemaname = \$\$public\$\$
                ORDER BY tablename
              " > source-tables.txt
              while IFS="|" read -r schema table; do
                count=$(psql "$NEON_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM \"$schema\".\"$table\"")
                printf "%s.%s|%s\\n" "$schema" "$table" "$count"
              done < source-tables.txt > source-row-counts.txt
              echo "Exported schema and source row counts."
              wc -l source-tables.txt
            '

      - name: Check schema dump for known unsupported DDL
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ein 'CREATE (SERVER|SUBSCRIPTION|PUBLICATION)|CREATE FOREIGN TABLE|PARTITION BY|PARTITION OF| INHERITS ' migration-artifacts/schema.sql; then
            echo "::error::Review unsupported PostgreSQL DDL before importing into TiDB."
            exit 1
          fi
          echo "No known unsupported DDL patterns detected. This is not a full compatibility certification."

      - name: Upload schema and source inventory
        uses: actions/upload-artifact@v4
        with:
          name: neon-tidb-migration-review
          path: migration-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Preflight schema and data in isolated TiDB schema
        if: ${{ inputs.operation == 'preflight' }}
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: |
          set -euo pipefail
          PREFLIGHT_SCHEMA="nexora_migration_preflight_${GITHUB_RUN_ID}"
          export PREFLIGHT_SCHEMA
          python3 - <<'PY'
          import os, re
          schema = os.environ["PREFLIGHT_SCHEMA"]
          if not re.fullmatch(r"[a-z][a-z0-9_]{0,62}", schema):
              raise SystemExit("Invalid preflight schema identifier")
          with open("migration-artifacts/schema.sql", encoding="utf-8") as f:
              ddl = f.read()
          ddl = ddl.replace("CREATE SCHEMA public;", f"CREATE SCHEMA {schema};")
          ddl = ddl.replace("COMMENT ON SCHEMA public", f"COMMENT ON SCHEMA {schema}")
          ddl = re.sub(r"\bpublic\.", schema + ".", ddl)
          ddl = re.sub(r"(?m)^SET [^;]+;\s*\n", "", ddl)
          ddl = re.sub(r"(?m)^SELECT pg_catalog\.set_config\([^;]+;\s*\n", "", ddl)
          with open("migration-artifacts/preflight-schema.sql", "w", encoding="utf-8") as f:
              f.write(ddl)
          PY
          docker run --rm --network host \
            -e NEON_DATABASE_URL -e TIDB_DATABASE_URL -e PREFLIGHT_SCHEMA \
            -v "$PWD/migration-artifacts:/work" -w /work \
            postgres:18 bash -euo pipefail -c '
              db=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT current_database()")
              version=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT version()")
              echo "TiDB preflight target database: $db"
              echo "TiDB server: $version"
              public_tables=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = \\$\\$public\\$\\$ AND table_type = \\$\\$BASE TABLE\\$\\$ AND table_name NOT LIKE \\$\\$tidbcloud_com_cell_%\\$\\$")
              echo "Existing public application tables in TiDB: $public_tables"
              exists=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM information_schema.schemata WHERE schema_name = \\$\\${PREFLIGHT_SCHEMA}\\$\\$")
              if [ "$exists" != "0" ]; then
                echo "Refusing preflight: temporary schema already exists: $PREFLIGHT_SCHEMA"
                exit 1
              fi
              cleanup() { psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS $PREFLIGHT_SCHEMA CASCADE" >/dev/null 2>&1 || true; }
              trap cleanup EXIT
              psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "CREATE SCHEMA $PREFLIGHT_SCHEMA"
              psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f preflight-schema.sql
              pg_dump --data-only --schema=public --no-owner --no-privileges "$NEON_DATABASE_URL" > preflight-data.sql
              sed -i "s/public\./$PREFLIGHT_SCHEMA./g" preflight-data.sql
              sed -i "/^SET /d" preflight-data.sql
              sed -i "/^SELECT pg_catalog.set_config/d" preflight-data.sql
              psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f preflight-data.sql
              echo "Checking all source table row counts in isolated schema..."
              while IFS="|" read -r source_schema table expected; do
                actual=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM \"$PREFLIGHT_SCHEMA\".\"$table\"")
                if [ "$actual" != "$expected" ]; then
                  echo "PREFLIGHT COUNT MISMATCH $table source=$expected target=$actual"
                  exit 1
                fi
                printf "OK %s %s rows\n" "$table" "$actual"
              done < source-row-counts.txt
              echo "Preflight passed: schema and all data imported and verified in isolated schema."
            '
      - name: Import schema and data into TiDB
        if: ${{ inputs.operation == 'migrate' }}
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e NEON_DATABASE_URL -e TIDB_DATABASE_URL \
            -v "$PWD/migration-artifacts:/work" -w /work \
            postgres:18 bash -euo pipefail -c '
              # Never overwrite an existing application schema.
              existing=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -v schema_name=public -v base_table_type='BASE TABLE' -v managed_prefix='tidbcloud_com_cell_%' -At -c "
                SELECT count(*) FROM information_schema.tables
                WHERE table_schema = \$\$public\$\$
                  AND table_type = \$\$BASE TABLE\$\$
                  AND table_name NOT LIKE \$\$tidbcloud_com_cell_%\$\$
              ")
              if [ "$existing" != "0" ]; then
                echo "Refusing import: TiDB already contains public base tables."
                exit 1
              fi

              psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f schema.sql
              pg_dump --data-only --schema=public --no-owner --no-privileges "$NEON_DATABASE_URL" |
                psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1

              echo "Data transfer finished. Comparing row counts..."
              while IFS="|" read -r schema table expected; do
                actual=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM \"$schema\".\"$table\"")
                if [ "$actual" != "$expected" ]; then
                  echo "COUNT MISMATCH $schema.$table source=$expected target=$actual"
                  exit 1
                fi
                printf "OK %s.%s %s rows\\n" "$schema" "$table" "$actual"
              done < source-row-counts.txt
              echo "All public table row counts match."
            '
