name: Neon to TiDB PostgreSQL Migration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Export, safely test the schema/data in an isolated TiDB schema, or migrate into public"
        required: true
        type: choice
        options:
          - export
          - preflight
          - migrate
          - schema-audit
          - schema-repair-preflight
        default: export
      confirm_target_empty:
        description: "Required for migrate: confirm the TiDB target has no application tables/data"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: neon-to-tidb-migration
  cancel-in-progress: false

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NEON_DATABASE_URL" || { echo "::error::Missing NEON_DATABASE_URL repository secret"; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote
          value = os.environ["NEON_DATABASE_URL"]
          parsed = urlsplit(value)
          if parsed.scheme not in ("postgres", "postgresql") or not parsed.hostname:
              raise SystemExit("NEON_DATABASE_URL is not a valid PostgreSQL URL")
          database = unquote(parsed.path.lstrip("/"))
          print("Neon source endpoint (credentials hidden):")
          print(f"  host={parsed.hostname}")
          print(f"  port={parsed.port or 5432}")
          print(f"  database={database or '(not specified)'}")
          PY
          if [[ "${{ inputs.operation }}" == "preflight" || "${{ inputs.operation }}" == "migrate" || "${{ inputs.operation }}" == "schema-audit" || "${{ inputs.operation }}" == "schema-repair-preflight" ]]; then
            test -n "$TIDB_DATABASE_URL" || { echo "::error::Missing TIDB_DATABASE_URL repository secret"; exit 1; }
          fi
          if [[ "${{ inputs.operation }}" == "migrate" ]]; then
            [[ "${{ inputs.confirm_target_empty }}" == "true" ]] || { echo "::error::Set confirm_target_empty only after verifying the TiDB database is empty"; exit 1; }
          fi

      - name: Checkout application schema for audit
        if: ${{ inputs.operation == 'schema-audit' || inputs.operation == 'schema-repair-preflight' }}
        uses: actions/checkout@v4

      - name: Export schema and source row counts
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p migration-artifacts
          docker run --rm --network host \
            -e NEON_DATABASE_URL \
            -v "$PWD/migration-artifacts:/work" -w /work \
            postgres:18 bash -euo pipefail -c '
              pg_dump --version
              pg_dump --schema-only --schema=public --no-owner --no-privileges "$NEON_DATABASE_URL" > schema.sql
              psql "$NEON_DATABASE_URL" -X -v ON_ERROR_STOP=1 -v schema_name=public -At -F "|" -c "
                SELECT schemaname, tablename
                FROM pg_tables
                WHERE schemaname = \$\$public\$\$
                ORDER BY tablename
              " > source-tables.txt
              while IFS="|" read -r schema table; do
                count=$(psql "$NEON_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM \"$schema\".\"$table\"")
                printf "%s.%s|%s\\n" "$schema" "$table" "$count"
              done < source-tables.txt > source-row-counts.txt
              echo "Exported schema and source row counts."
              wc -l source-tables.txt
            '

      - name: Check schema dump for known unsupported DDL
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ein 'CREATE (SERVER|SUBSCRIPTION|PUBLICATION)|CREATE FOREIGN TABLE|PARTITION BY|PARTITION OF| INHERITS ' migration-artifacts/schema.sql; then
            echo "::error::Review unsupported PostgreSQL DDL before importing into TiDB."
            exit 1
          fi
          echo "No known unsupported DDL patterns detected. This is not a full compatibility certification."

      - name: Upload schema and source inventory
        uses: actions/upload-artifact@v4
        with:
          name: neon-tidb-migration-review
          path: migration-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Preflight schema and data in isolated TiDB schema
        if: ${{ inputs.operation == 'preflight' }}
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: |
          set -euo pipefail
          PREFLIGHT_SCHEMA="nexora_migration_preflight_${GITHUB_RUN_ID}"
          export PREFLIGHT_SCHEMA
          python3 - <<'PY'
          import os, re
          schema = os.environ["PREFLIGHT_SCHEMA"]
          if not re.fullmatch(r"[a-z][a-z0-9_]{0,62}", schema):
              raise SystemExit("Invalid preflight schema identifier")
          with open("migration-artifacts/schema.sql", encoding="utf-8") as f:
              ddl = f.read()
          ddl = ddl.replace("CREATE SCHEMA public;", f"CREATE SCHEMA {schema};")
          ddl = ddl.replace("COMMENT ON SCHEMA public", f"COMMENT ON SCHEMA {schema}")
          ddl = re.sub(r"\bpublic\.", schema + ".", ddl)
          ddl = re.sub(r"(?m)^SET [^;]+;\s*\n", "", ddl)
          ddl = re.sub(r"(?m)^SELECT pg_catalog\.set_config\([^;]+;\s*\n", "", ddl)
          with open("migration-artifacts/preflight-schema.sql", "w", encoding="utf-8") as f:
              f.write(ddl)
          PY
          docker run --rm -i --network host \
            -e NEON_DATABASE_URL -e TIDB_DATABASE_URL -e PREFLIGHT_SCHEMA \
            -v "$PWD/migration-artifacts:/work" -w /work \
            postgres:18 bash -euo pipefail -s <<'CONTAINER_SCRIPT'
          db=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT current_database()")
          version=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT version()")
          echo "TiDB preflight target database: $db"
          echo "TiDB server: $version"
          public_tables=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE' AND table_name NOT LIKE 'tidbcloud_com_cell_%'")
          echo "Existing public application tables in TiDB: $public_tables"
          exists=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM information_schema.schemata WHERE schema_name = '$PREFLIGHT_SCHEMA'")
          if [ "$exists" != "0" ]; then
            echo "Refusing preflight: temporary schema already exists: $PREFLIGHT_SCHEMA"
            exit 1
          fi
          cleanup() { psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS $PREFLIGHT_SCHEMA CASCADE" >/dev/null; echo "Temporary preflight schema cleanup completed."; }
          trap cleanup EXIT
          # The rewritten schema dump already contains CREATE SCHEMA for this isolated schema.
          psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f preflight-schema.sql
          pg_dump --data-only --inserts --rows-per-insert=100 --schema=public --no-owner --no-privileges "$NEON_DATABASE_URL" > preflight-data.sql
          sed -i "s/public\\./$PREFLIGHT_SCHEMA./g" preflight-data.sql
          sed -i "/^SET /d" preflight-data.sql
          sed -i "/^SELECT pg_catalog.set_config/d" preflight-data.sql
          psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f preflight-data.sql
          echo "Checking all source table row counts in isolated schema..."
          while IFS="|" read -r source_table expected; do
            if [[ ! "$source_table" =~ ^public\.[a-zA-Z_][a-zA-Z0-9_]*$ || ! "$expected" =~ ^[0-9]+$ ]]; then
              echo "Refusing invalid source inventory row: $source_table|$expected"
              exit 1
            fi
            table="${source_table#public.}"
            actual=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM \"$PREFLIGHT_SCHEMA\".\"$table\"")
            if [ "$actual" != "$expected" ]; then
              echo "PREFLIGHT COUNT MISMATCH $table source=$expected target=$actual"
              exit 1
            fi
            printf "OK %s %s rows\\n" "$table" "$actual"
          done < source-row-counts.txt
          echo "Preflight passed: schema and all data imported and verified in isolated schema."
          CONTAINER_SCRIPT
      - name: Compare TiDB schema with Prisma application schema
        if: ${{ inputs.operation == 'schema-audit' }}
        shell: bash
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p migration-artifacts
          npx --yes prisma@6.15.0 migrate diff \
            --from-url "$TIDB_DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > migration-artifacts/tidb-to-prisma-schema-diff.sql
          {
            echo "TiDB public schema versus prisma/schema.prisma"
            echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "CREATE TABLE statements:"
            grep -Ec '^[[:space:]]*CREATE TABLE' migration-artifacts/tidb-to-prisma-schema-diff.sql || true
            echo "ALTER TABLE statements:"
            grep -Ec '^[[:space:]]*ALTER TABLE' migration-artifacts/tidb-to-prisma-schema-diff.sql || true
            echo "DROP statements (review carefully; this audit does not execute SQL):"
            grep -Ein '^[[:space:]]*DROP ' migration-artifacts/tidb-to-prisma-schema-diff.sql || true
            echo
            echo "This workflow only generates a diff. It does not change TiDB or Neon."
          } > migration-artifacts/tidb-schema-audit-summary.txt
          cat migration-artifacts/tidb-schema-audit-summary.txt

      - name: Upload Prisma schema audit
        if: ${{ inputs.operation == 'schema-audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: tidb-prisma-schema-audit
          path: |
            migration-artifacts/tidb-to-prisma-schema-diff.sql
            migration-artifacts/tidb-schema-audit-summary.txt
          if-no-files-found: error
          retention-days: 7

      - name: Safely test Prisma schema repair in an isolated TiDB schema
        if: ${{ inputs.operation == 'schema-repair-preflight' }}
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: |
          set -euo pipefail
          REPAIR_TEST_SCHEMA="tidb_schema_repair_test_${GITHUB_RUN_ID}"
          export REPAIR_TEST_SCHEMA
          # Build the isolated test baseline from the actual TiDB public schema,
          # not Neon. The repair diff is generated from TiDB, so testing it against
          # a Neon schema can collide with indexes/objects that already differ.
          docker run --rm --network host \
            -e TIDB_DATABASE_URL \
            -v "$PWD/migration-artifacts:/work" -w /work \
            postgres:18 bash -euo pipefail -c '
              pg_dump --schema-only --schema=public --no-owner --no-privileges "$TIDB_DATABASE_URL" > tidb-current-schema.sql
            '
          python3 - <<'PY'
          import os, re
          schema = os.environ["REPAIR_TEST_SCHEMA"]
          if not re.fullmatch(r"[a-z][a-z0-9_]{0,62}", schema):
              raise SystemExit("Invalid temporary schema identifier")
          with open("migration-artifacts/tidb-current-schema.sql", encoding="utf-8") as f:
              ddl = f.read()
          ddl = ddl.replace("CREATE SCHEMA public;", f"CREATE SCHEMA {schema};")
          ddl = ddl.replace("COMMENT ON SCHEMA public", f"COMMENT ON SCHEMA {schema}")
          # pg_dump qualifies enum types as public.Type, while tables may use "public"."name".
          # Rewrite both qualified forms so enum types are isolated too.
          ddl = re.sub(r'(?<![A-Za-z0-9_])public\.', f'"{schema}".', ddl)
          ddl = re.sub(r"(?m)^SET [^;]+;\s*\n", "", ddl)
          ddl = re.sub(r"(?m)^SELECT pg_catalog\.set_config\([^;]+;\s*\n", "", ddl)
          with open("migration-artifacts/repair-test-base.sql", "w", encoding="utf-8") as f:
              f.write(ddl)
          PY
          npx --yes prisma@6.15.0 migrate diff \
            --from-url "$TIDB_DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > migration-artifacts/tidb-to-prisma-schema-diff.sql
          python3 - <<'PY'
          import os, re
          schema = os.environ["REPAIR_TEST_SCHEMA"]
          path = "migration-artifacts/tidb-to-prisma-schema-diff.sql"
          sql = open(path, encoding="utf-8").read()
          # Preserve TiDB-managed tables and existing performance indexes.
          sql = re.sub(r'(?m)^DROP TABLE "public"\."tidbcloud_com_cell_[^"]+";\s*\n?', "", sql)
          sql = re.sub(r'(?m)^DROP INDEX "public"\."maintenance_records_vehiclePlateNumber_idx";\s*\n?', "", sql)
          sql = re.sub(r'(?m)^DROP INDEX "public"\."tire_lifecycle_events_tireId_eventAt_idx";\s*\n?', "", sql)
          sql = re.sub(r'(?m)^CREATE INDEX "tire_lifecycle_events_tireId_eventAt_idx" ON "public"\."tire_lifecycle_events"\("tireId", "eventAt"\);\s*\n?', "", sql)
          # Replace the obsolete unique emailId index with the non-unique
          # lookup index explicitly declared by Prisma's EmailLog model.
          old_email_index = 'DROP INDEX "public"."email_logs_emailId_key";'
          if old_email_index not in sql:
              raise SystemExit("Expected obsolete email_logs unique index was not found")
          sql = sql.replace(
              old_email_index,
              old_email_index + '\nCREATE INDEX "email_logs_emailId_idx" ON "public"."email_logs"("emailId");',
              1,
          )
          # The only permitted index removal is the obsolete unique emailId index:
          # the Prisma model now permits multiple webhook events per email.
          forbidden = re.findall(r'(?im)^\s*DROP\s+(?:TABLE|INDEX|TYPE|SCHEMA)\b.*;', sql)
          for statement in forbidden:
              if 'DROP INDEX "public"."email_logs_emailId_key"' not in statement:
                  raise SystemExit("Unexpected destructive DDL in schema diff: " + statement)
          if 'DROP TABLE "public"."tidbcloud_com_cell_' in sql:
              raise SystemExit("Refusing to drop TiDB-managed tables")
          sql = sql.replace('"public".', f'"{schema}".')
          open("migration-artifacts/tidb-schema-repair-preflight.sql", "w", encoding="utf-8").write(sql)

          # Also emit the reviewed production-target version. This is an artifact only;
          # this workflow operation never applies it to public.
          public_sql = sql.replace(f'"{schema}".', '"public".')
          open("migration-artifacts/tidb-schema-repair-public.sql", "w", encoding="utf-8").write(public_sql)
          destructive = re.findall(r'(?im)^\s*(DROP\s+(?:TABLE|INDEX|TYPE|SCHEMA)|ALTER TABLE .* DROP CONSTRAINT)\b.*;', public_sql)
          with open("migration-artifacts/tidb-schema-repair-review.txt", "w", encoding="utf-8") as report:
              report.write("PRODUCTION SCHEMA REPAIR PLAN — NOT APPLIED\n")
              report.write("Target: TiDB public schema\n")
              report.write("Existing row data is preserved; new tables are empty.\n")
              report.write("Reviewed destructive/constraint-change statements:\n")
              for statement in destructive:
                  report.write(statement + "\n")
              report.write("\nForeign keys dropped by the plan are recreated later in the same SQL file.\n")
              report.write("The email_logs.emailId unique index is replaced by email_logs_emailId_idx (non-unique), as declared by Prisma EmailLog.\n")
          print("Sanitized repair DDL generated; TiDB-managed tables and unrelated indexes are protected.")
          PY
          docker run --rm -i --network host \
            -e TIDB_DATABASE_URL -e REPAIR_TEST_SCHEMA \
            -v "$PWD/migration-artifacts:/work" -w /work \
            postgres:18 bash -euo pipefail -s <<'CONTAINER_SCRIPT'
          exists=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM information_schema.schemata WHERE schema_name = '$REPAIR_TEST_SCHEMA'")
          if [ "$exists" != "0" ]; then
            echo "Refusing to reuse existing test schema: $REPAIR_TEST_SCHEMA"
            exit 1
          fi
          cleanup() {
            psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS $REPAIR_TEST_SCHEMA CASCADE" >/dev/null
            echo "Temporary schema cleanup completed."
          }
          trap cleanup EXIT
          psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f repair-test-base.sql
          psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tidb-schema-repair-preflight.sql
          required=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = '$REPAIR_TEST_SCHEMA' AND table_type = 'BASE TABLE'")
          if [ "$required" -lt 44 ]; then
            echo "Schema repair test created only $required tables; expected at least 44."
            exit 1
          fi
          echo "Schema repair DDL passed in isolated TiDB schema. Tables present: $required"
          CONTAINER_SCRIPT
          {
            echo "Isolated TiDB schema-repair preflight: PASS"
            echo "The generated repair SQL was applied only to $REPAIR_TEST_SCHEMA and that schema was removed."
            echo "No public TiDB tables or Neon data were modified."
          } > migration-artifacts/tidb-schema-repair-preflight-summary.txt

      - name: Upload schema repair preflight
        if: ${{ inputs.operation == 'schema-repair-preflight' }}
        uses: actions/upload-artifact@v4
        with:
          name: tidb-schema-repair-preflight
          path: |
            migration-artifacts/tidb-schema-repair-preflight.sql
            migration-artifacts/tidb-schema-repair-public.sql
            migration-artifacts/tidb-schema-repair-review.txt
            migration-artifacts/tidb-schema-repair-preflight-summary.txt
          if-no-files-found: error
          retention-days: 7

      - name: Import schema and data into TiDB
        if: ${{ inputs.operation == 'migrate' }}
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm -i --network host \
            -e NEON_DATABASE_URL -e TIDB_DATABASE_URL \
            -v "$PWD/migration-artifacts:/work" -w /work \
            postgres:18 bash -euo pipefail -s <<'CONTAINER_SCRIPT'
          # Never overwrite an existing application schema.
          existing=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "
            SELECT count(*) FROM information_schema.tables
            WHERE table_schema = 'public'
              AND table_type = 'BASE TABLE'
              AND table_name NOT LIKE 'tidbcloud_com_cell_%'
          ")
          if [ "$existing" != "0" ]; then
            echo "Refusing import: TiDB already contains public base tables."
            exit 1
          fi

          # TiDB creates the public schema for each database; do not try to create it again.
          sed -i '/^CREATE SCHEMA public;$/d' schema.sql
          if grep -Eq '^[[:space:]]*CREATE SCHEMA[[:space:]]+public([;[:space:]]|$)' schema.sql; then
            echo "Refusing import: schema.sql still attempts to create the existing public schema."
            exit 1
          fi
          psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f schema.sql
          pg_dump --data-only --inserts --rows-per-insert=100 --schema=public --no-owner --no-privileges "$NEON_DATABASE_URL" |
            psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1

          echo "Data transfer finished. Comparing row counts..."
          while IFS="|" read -r source_table expected; do
            if [[ ! "$source_table" =~ ^public\.[a-zA-Z_][a-zA-Z0-9_]*$ || ! "$expected" =~ ^[0-9]+$ ]]; then
              echo "Refusing invalid source inventory row: $source_table|$expected"
              exit 1
            fi
            table="${source_table#public.}"
            actual=$(psql "$TIDB_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM \"public\".\"$table\"")
            if [ "$actual" != "$expected" ]; then
              echo "COUNT MISMATCH public.$table source=$expected target=$actual"
              exit 1
            fi
            printf "OK public.%s %s rows\\n" "$table" "$actual"
          done < source-row-counts.txt
          echo "All public table row counts match."
          CONTAINER_SCRIPT
