name: TiDB Tenant Provisioning Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tidb-tenant-provisioning-smoke
  cancel-in-progress: false

jobs:
  tenant-provisioning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Test isolated TiDB tenant provisioning and schema bootstrap
        run: node scripts/tidb-tenant-provisioning-smoke.cjs
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
